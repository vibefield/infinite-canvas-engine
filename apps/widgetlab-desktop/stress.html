<!DOCTYPE html>
<html lang="en" data-anim="none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:" />
  <title>stress rig (many animating DOM cards: live DOM at rest vs always GPU)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101010; overflow: hidden; }
    #root { position: absolute; inset: 0; }

    /* The card's content. Every animation is gated by the document's `data-anim`
       attribute so one attribute write switches the WHOLE board without touching the
       world or React — the measurement must not pay for its own switch. */
    .st-card { position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; font: 11px/1.3 system-ui, sans-serif; color: #e8e8f0; padding: 8px 10px; }
    .st-title { font-weight: 600; font-size: 12px; margin-bottom: 2px; white-space: nowrap; }
    .st-text { position: absolute; left: 10px; right: 10px; bottom: 6px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* COMPOSITOR-DRIVEN pair: a rotating ring and a fading dot. `transform` and
       `opacity`, each on its own `will-change` layer, so a live-DOM arm animates
       them on Chromium's compositor thread with no main-thread paint at all. */
    .st-spin { position: absolute; left: 12px; top: 30px; width: 28px; height: 28px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.18); border-top-color: #ffd166; will-change: transform; }
    .st-pulse { position: absolute; left: 52px; top: 38px; width: 12px; height: 12px; border-radius: 50%; background: #06d6a0; will-change: opacity; }
    html[data-anim="compositor"] .st-spin { animation: st-rot 1s linear infinite; }
    html[data-anim="compositor"] .st-pulse { animation: st-fade 0.8s ease-in-out infinite alternate; }
    /* ONE animator on the board: only card 0 spins, so a single card's dirt is measured
       against the whole-board frame build it wakes. */
    html[data-anim="compositor-one"] .st-card[data-one] .st-spin { animation: st-rot 1s linear infinite; }
    html[data-anim="compositor-one"] .st-card[data-one] .st-pulse { animation: st-fade 0.8s ease-in-out infinite alternate; }

    /* PAINT-DRIVEN pair: a bar whose WIDTH animates (layout + paint every frame)
       and a block whose background colour cycles (paint every frame). Neither can
       ride the compositor: a live-DOM arm re-lays-out and repaints the card. */
    .st-bar { position: absolute; left: 76px; top: 34px; height: 8px; width: 20%; border-radius: 4px; background: #ef476f; }
    .st-hue { position: absolute; left: 76px; top: 48px; width: 40px; height: 10px; border-radius: 3px; background: #118ab2; }
    html[data-anim="paint"] .st-bar { animation: st-grow 1.2s ease-in-out infinite alternate; }
    html[data-anim="paint"] .st-hue { animation: st-hue 1.5s linear infinite; }

    @keyframes st-rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes st-fade { from { opacity: 1; } to { opacity: 0.15; } }
    @keyframes st-grow { from { width: 15%; } to { width: 55%; } }
    @keyframes st-hue { 0% { background: #118ab2; } 33% { background: #ef476f; } 66% { background: #ffd166; } 100% { background: #118ab2; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/rigs/stress.tsx"></script>
</body>
</html>

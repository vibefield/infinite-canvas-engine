<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HiC copy micro-benchmark</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101010; overflow: hidden; font: 12px system-ui, sans-serif; color: #ddd; }
    #src { position: absolute; left: 0; top: 0; display: block; }
    .wrap { position: absolute; left: 0; top: 0; }
    .card { position: absolute; left: 0; top: 0; box-sizing: border-box; overflow: hidden; background: #1b3a5c; color: #fff; }
    .card.stress, .card.text { border: 2px solid #e8c547; border-radius: 8px; }
    .card .title { font: 700 14px/1.2 system-ui, sans-serif; padding: 6px 8px 2px; white-space: nowrap; }
    .card .bar { height: 10px; background: linear-gradient(90deg, #d94f4f, #3fbf6f); margin: 4px 8px; border-radius: 5px; }
    .card .ring { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; border-top-color: transparent; margin: 4px 8px; }
    .card .fade { opacity: 0.6; }
    .card .pulse { opacity: 0.8; width: 40px; height: 8px; background: #7cc4ff; margin: 2px 8px; border-radius: 4px; }
    .card .p { font: 11px/1.3 system-ui, sans-serif; padding: 0 8px; color: #cfd8e3; }
    html[data-anim="compositor"] .card .ring { animation: spin 1.2s linear infinite; will-change: transform; }
    html[data-anim="compositor"] .card .pulse { animation: pulse 0.9s ease-in-out infinite alternate; will-change: opacity; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
    #log { position: absolute; right: 8px; bottom: 8px; font: 11px ui-monospace, monospace; color: #9aa; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="src" layoutsubtree></canvas>
  <div id="log">booting…</div>
<script>
/*
 * THE COPY'S COST, WITHOUT THE ENGINE (2026-09-09; driver: scripts/hic-micro.mjs).
 *
 * A no-engine measurement of Chromium's HTML-in-Canvas copy: N immediate children of one
 * `layoutsubtree` canvas, copied into a WebGPU page array with `copyElementImageToTexture`,
 * with knobs for what the source suggests should and should not matter:
 *   n, w×h (CSS px; texels = ×dpr), content (flat | stress | text), anim (none | compositor),
 *   mode: copy (one call per card) | wrapper (cards inside page-sized wrappers, one call per
 *   wrapper; `wrapCap` cards per wrapper) | screen (one viewport-sized wrapper) | own (one
 *   private destination texture per card) | draw2d (drawElementImage into the source canvas's
 *   2D context, then ONE copyExternalImageToTexture of the canvas); `budget`: at most that many
 *   copies per frame, round-robin (mode copy).
 * Per run: frames, fps, copies/s, main-thread ms inside the copy loop per frame and per copy.
 */
const $log = document.getElementById("log");
const say = (m) => { $log.textContent = m; };
const src = document.getElementById("src");
const DPR = window.devicePixelRatio;
const PAGE = 2048;            // page layer side in texels
const CSS_PAGE = PAGE / DPR;  // the same in CSS px
const MAX_LAYERS = 24;

let device = null, queue = null, pages = null, own = [], ctx2d = null;
let cards = [], wrappers = [], cfg = null, slots = [], wrapOrigin = [];
let cursor = 0; // the copy budget's round-robin position
let gpuErrors = 0;

async function boot() {
  const adapter = await navigator.gpu.requestAdapter();
  device = await adapter.requestDevice();
  device.addEventListener("uncapturederror", (e) => { gpuErrors += 1; if (gpuErrors <= 5) console.error(`[micro] gpu error: ${e.error.message}`); });
  queue = device.queue;
  src.style.width = `${CSS_PAGE}px`; src.style.height = `${CSS_PAGE}px`;
  src.width = PAGE; src.height = PAGE;
  // the engine's source canvas holds a 2D context (dom/source-canvas.ts); so does this one
  ctx2d = src.getContext("2d");
  return true;
}

function content(kind, i) {
  if (kind === "flat") return `<div class="title">card ${i}</div>`;
  if (kind === "text") return `<div class="title">card ${i}</div><div class="p">Twelve lines of body text set in the system face, wrapping inside the card so the glyph run count is what a note would carry: ${"lorem ipsum dolor sit amet ".repeat(6)}</div>`;
  // stress: the rig's card shape — a title, a gradient bar, a ring, and two translucent groups (saveLayers)
  return `<div class="title">card ${i}</div><div class="bar"></div><div class="ring"></div><div class="fade"><div class="p">status · ${i}</div></div><div class="pulse"></div>`;
}

function clear() {
  for (const c of cards) c.remove();
  for (const w of wrappers) w.remove();
  cards = []; wrappers = []; slots = []; wrapOrigin = [];
  for (const t of own) t.destroy();
  own = [];
  if (pages) { pages.destroy(); pages = null; }
}

/** Build the board for a config. */
function setup(c) {
  clear();
  cfg = c;
  document.documentElement.setAttribute("data-anim", c.anim ?? "none");
  const tw = Math.ceil(c.w * DPR), th = Math.ceil(c.h * DPR);
  const cols = Math.max(1, Math.floor(PAGE / (tw + 2)));
  const rows = Math.max(1, Math.floor(PAGE / (th + 2)));
  const perLayer = cols * rows;
  const layers = Math.min(MAX_LAYERS, Math.max(1, Math.ceil(c.n / perLayer)));
  const usage = GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC | GPUTextureUsage.RENDER_ATTACHMENT;
  if (c.mode !== "own") pages = device.createTexture({ label: "pages", size: [PAGE, PAGE, layers], format: "rgba8unorm", dimension: "2d", usage });
  const makeCard = (i) => {
    const el = document.createElement("div");
    el.className = `card ${c.content}`;
    el.style.width = `${c.w}px`; el.style.height = `${c.h}px`;
    el.innerHTML = content(c.content, i);
    return el;
  };
  if (c.mode === "screen") {
    // ONE viewport-sized wrapper holding every card at its on-screen position (overlapping); one call per frame
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const w = document.createElement("div");
    w.className = "wrap";
    w.style.width = `${vw}px`; w.style.height = `${vh}px`;
    src.appendChild(w);
    wrappers.push(w);
    for (let i = 0; i < c.n; i++) {
      const el = makeCard(i);
      const gx = (i % 8) * (c.w + 4), gy = (Math.floor(i / 8) % 7) * (c.h + 4);
      el.style.transform = `translate(${gx}px, ${gy}px)`;
      w.appendChild(el);
      cards.push(el);
    }
    pages.destroy();
    pages = device.createTexture({ label: "screen", size: [Math.ceil(vw * DPR), Math.ceil(vh * DPR), 1], format: "rgba8unorm", dimension: "2d", usage });
    return { n: c.n, texels: Math.ceil(vw * DPR) * Math.ceil(vh * DPR), slot: { w: Math.ceil(vw * DPR), h: Math.ceil(vh * DPR) }, cols: 1, rows: 1, perLayer: c.n, layers: 1, wrappers: 1, dpr: DPR };
  }
  if (c.mode === "wrapper") {
    // page-sized wrappers as the immediate children; cards positioned inside at their slots (wrapCap cards per wrapper)
    const perWrap = Math.max(1, Math.min(perLayer, c.wrapCap ?? perLayer));
    const nWrap = Math.ceil(c.n / perWrap);
    for (let wIdx = 0; wIdx < nWrap; wIdx++) {
      const w = document.createElement("div");
      w.className = "wrap";
      // the wrapper is exactly the box its cards fill: a strip of ceil(perWrap/cols) rows
      const wRows = Math.ceil(perWrap / cols);
      w.style.width = `${Math.min(perWrap, cols) * (tw + 2) / DPR}px`; w.style.height = `${wRows * (th + 2) / DPR}px`;
      w.style.transform = `translate(${(wIdx % 4) * 6}px, ${Math.floor(wIdx / 4) * 6}px)`;
      src.appendChild(w);
      wrappers.push(w);
    }
    {
      const wRows = Math.ceil(perWrap / cols);
      const stripsPerLayer = Math.max(1, Math.floor(PAGE / (wRows * (th + 2))));
      for (let wIdx = 0; wIdx < wrappers.length; wIdx++) wrapOrigin.push({ x: 0, y: (wIdx % stripsPerLayer) * wRows * (th + 2), z: Math.floor(wIdx / stripsPerLayer) % layers });
    }
    for (let i = 0; i < c.n; i++) {
      const el = makeCard(i);
      const k = i % perWrap;
      const x = (k % cols) * (tw + 2) / DPR, y = Math.floor(k / cols) * (th + 2) / DPR;
      el.style.transform = `translate(${x}px, ${y}px)`;
      wrappers[Math.floor(i / perWrap)].appendChild(el);
      cards.push(el);
    }
  } else {
    for (let i = 0; i < c.n; i++) {
      const el = makeCard(i);
      const k = i % perLayer;
      const layer = Math.floor(i / perLayer) % layers;
      const sx = (k % cols) * (tw + 2), sy = Math.floor(k / cols) * (th + 2);
      // lay the hosts out in a grid over the viewport (overlap when there are more than fit — layout, not paint)
      const gx = (i % 8) * (c.w + 4), gy = (Math.floor(i / 8) % 8) * (c.h + 4);
      el.style.transform = `translate(${gx}px, ${gy}px)`;
      src.appendChild(el);
      cards.push(el);
      slots.push({ x: sx, y: sy, z: layer });
      if (c.mode === "own") own.push(device.createTexture({ label: `own ${i}`, size: [tw, th], format: "rgba8unorm", usage }));
    }
  }
  return { n: c.n, texels: tw * th, slot: { w: tw, h: th }, cols, rows, perLayer, layers, wrappers: wrappers.length, dpr: DPR };
}

/** One frame's worth of copies; returns the count issued. */
function copyFrame() {
  let issued = 0;
  if (cfg.mode === "wrapper" || cfg.mode === "screen") {
    for (let i = 0; i < wrappers.length; i++) {
      const o = wrapOrigin[i] ?? { x: 0, y: 0, z: 0 };
      queue.copyElementImageToTexture({ source: wrappers[i] }, { destination: { texture: pages, origin: o } });
      issued += 1;
    }
  } else if (cfg.mode === "own") {
    for (let i = 0; i < cards.length; i++) {
      queue.copyElementImageToTexture({ source: cards[i] }, { destination: { texture: own[i], origin: { x: 0, y: 0, z: 0 } } });
      issued += 1;
    }
  } else if (cfg.mode === "draw2d") {
    for (let i = 0; i < cards.length; i++) {
      const s = slots[i];
      ctx2d.drawElementImage(cards[i], s.x, s.y);
      issued += 1;
    }
    queue.copyExternalImageToTexture({ source: src }, { texture: pages, origin: { x: 0, y: 0, z: 0 } }, [PAGE, PAGE, 1]);
  } else {
    // `budget`: at most that many copies per frame, round-robin over the cards (a card's cadence = budget × fps / n)
    const k = cfg.budget && cfg.budget > 0 ? Math.min(cfg.budget, cards.length) : cards.length;
    for (let j = 0; j < k; j++) {
      const i = (cursor + j) % cards.length;
      const s = slots[i];
      queue.copyElementImageToTexture({ source: cards[i] }, { destination: { texture: pages, origin: { x: s.x, y: s.y, z: s.z } } });
      issued += 1;
    }
    cursor = (cursor + k) % cards.length;
  }
  return issued;
}

/** Run the copy loop for `ms` and report. `warmMs` frames are discarded first. */
function run({ ms = 2000, warmMs = 400 } = {}) {
  return new Promise((resolve) => {
    const frameMs = [], copyMs = [];
    let copies = 0, frames = 0, last = 0, t0 = 0, warm = true, tw0 = performance.now();
    gpuErrors = 0;
    const tick = (t) => {
      if (warm) { if (t - tw0 >= warmMs) { warm = false; t0 = t; last = t; } else { copyFrame(); queue.submit([]); requestAnimationFrame(tick); return; } }
      else { frameMs.push(t - last); last = t; }
      const a = performance.now();
      const issued = copyFrame();
      const enc = device.createCommandEncoder();
      queue.submit([enc.finish()]);
      copyMs.push(performance.now() - a);
      copies += issued; frames += 1;
      if (t - t0 >= ms) {
        const wall = t - t0;
        const sorted = [...frameMs].sort((x, y) => x - y);
        const q = (p) => sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))] : NaN;
        const sumCopy = copyMs.reduce((x, y) => x + y, 0);
        const out = { frames, wallMs: wall, fps: frames / (wall / 1000), copies, copiesPerS: copies / (wall / 1000), copyMsPerFrame: sumCopy / frames, mainMsPerCopy: copies ? sumCopy / copies : NaN, mainMsPerS: sumCopy / (wall / 1000), p50: q(0.5), p95: q(0.95), max: sorted[sorted.length - 1], gpuErrors };
        say(JSON.stringify(out));
        resolve(out);
        return;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/** GPU completion latency after a burst: the time from submit to onSubmittedWorkDone. */
async function drain() {
  const a = performance.now();
  await queue.onSubmittedWorkDone();
  return performance.now() - a;
}

/** Read one slot back and count ink (content guard). */
async function ink(i = 0) {
  if (!pages && cfg.mode !== "own") return null;
  const tw = Math.ceil(cfg.w * DPR), th = Math.ceil(cfg.h * DPR);
  const w = Math.min(64, tw), h = Math.min(64, th);
  const bytesPerRow = 256; // 64 px × 4
  const buf = device.createBuffer({ size: bytesPerRow * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = device.createCommandEncoder();
  let s;
  if (cfg.mode === "own" || cfg.mode === "screen") s = { x: 0, y: 0, z: 0 };
  else if (cfg.mode === "wrapper") {
    const cols = Math.max(1, Math.floor(PAGE / (tw + 2)));
    const perWrap = Math.max(1, Math.min(cols * Math.max(1, Math.floor(PAGE / (th + 2))), cfg.wrapCap ?? Infinity));
    const wIdx = Math.floor(i / perWrap), k = i % perWrap;
    const o = wrapOrigin[wIdx];
    s = { x: o.x + (k % cols) * (tw + 2), y: o.y + Math.floor(k / cols) * (th + 2), z: o.z };
  } else s = slots[i];
  enc.copyTextureToBuffer({ texture: cfg.mode === "own" ? own[i] : pages, origin: { x: s.x, y: s.y, z: s.z } }, { buffer: buf, bytesPerRow, rowsPerImage: h }, { width: w, height: h, depthOrArrayLayers: 1 });
  queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const px = new Uint8Array(buf.getMappedRange());
  let inkN = 0; const total = w * h; const first = [px[0], px[1], px[2], px[3]];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const o = y * bytesPerRow + x * 4; if (px[o] !== first[0] || px[o + 1] !== first[1] || px[o + 2] !== first[2]) inkN += 1; }
  buf.unmap(); buf.destroy();
  return { ink: inkN, total, first };
}

window.__micro = { ready: boot(), setup, run, drain, ink, host: () => ({ dpr: DPR, chrome: navigator.userAgent.match(/Chrome\/([\d.]+)/)?.[1], hasCopy: typeof GPUQueue.prototype.copyElementImageToTexture === "function", hasDraw: typeof CanvasRenderingContext2D.prototype.drawElementImage === "function" }) };
</script>
</body>
</html>

packages:
  - "packages/*"
  - "apps/*"
  # design-016 K8b: worked plugin packages built on the umbrella's published entries alone (never published themselves)
  - "examples/*"
# pnpm 11 migration (2026-07-18): settings moved out of package.json#pnpm.
# allowBuilds carries the old onlyBuiltDependencies approvals. electron (binary
# download) and @vibecook/truffle (native addon + sidecar) were widgetlab-desktop's,
# and the @react-three/fiber patch rode `patchedDependencies` for the GL islands —
# all three left at design-015 D5b with the apps and packages that needed them.
# (D5b's install left pnpm's "set this to true or false" placeholders for the two;
# D7 removed them — neither is in the lockfile, and every value here is a boolean.)
allowBuilds:
  "@biomejs/biome": true
  webgpu: true
  esbuild: true
# pnpm 10 spelling of the same approvals, kept as a fallback for anyone running
# pnpm 10 directly (it ignores `allowBuilds` wholesale). Normally moot: package.json
# pins packageManager to pnpm 11.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - webgpu
  - esbuild
# First-party exemption from the supply-chain minimum-release-age hold: we pin and bump
# @vibecook/strata-ecs the same day it publishes (the whole petition cadence), so the
# fresh-release quarantine only ever flags our own artifact. Third-party stays covered.
minimumReleaseAgeExclude:
  - "@vibecook/*"

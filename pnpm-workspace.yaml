packages:
  - "packages/*"
  - "apps/*"
# pnpm 11 migration (2026-07-18): settings moved out of package.json#pnpm.
# allowBuilds carries the old onlyBuiltDependencies approvals; the r3f patch
# rides patchedDependencies here or pnpm 11 silently stops applying it.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
patchedDependencies:
  "@react-three/fiber@9.6.1": patches/@react-three__fiber@9.6.1.patch

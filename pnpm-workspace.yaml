packages:
  - "packages/*"
  - "apps/*"
# pnpm 11 migration (2026-07-18): settings moved out of package.json#pnpm.
# allowBuilds carries the old onlyBuiltDependencies approvals; the r3f patch
# rides patchedDependencies here or pnpm 11 silently stops applying it.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
# First-party exemption from the supply-chain minimum-release-age hold: we pin and bump
# @vibecook/strata-ecs the same day it publishes (the whole petition cadence), so the
# fresh-release quarantine only ever flags our own artifact. Third-party stays covered.
minimumReleaseAgeExclude:
  - "@vibecook/*"
patchedDependencies:
  "@react-three/fiber@9.6.1": patches/@react-three__fiber@9.6.1.patch
